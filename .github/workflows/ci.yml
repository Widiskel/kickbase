name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Generate OpenAPI & Swagger Docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.3
          swag init -g cmd/server/main.go -o docs

      - name: Run Unit Tests
        run: go test ./test/unit/... -v -cover

      - name: Build Binary
        run: CGO_ENABLED=0 go build -v -ldflags="-s -w" -o kickbase cmd/server/main.go
