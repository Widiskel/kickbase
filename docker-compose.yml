services:
  postgres:
    image: postgres:16-alpine
    container_name: kickbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kickbase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kickbase-network

  app:
    build: .
    container_name: kickbase-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: kickbase
      DB_SSLMODE: disable
      SERVER_PORT: 8080
      LOG_LEVEL: info
      JWT_SECRET: kickbase-super-secret-jwt-key-2026
    networks:
      - kickbase-network

  prometheus:
    image: prom/prometheus:latest
    container_name: kickbase-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deploy/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml
    depends_on:
      - app
    networks:
      - kickbase-network

  grafana:
    image: grafana/grafana:latest
    container_name: kickbase-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/kickbase_dashboard.json"
    volumes:
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - kickbase-network

volumes:
  pgdata:

networks:
  kickbase-network:
    driver: bridge
