basePath: /
definitions:
  handler.CreateMatchRequest:
    properties:
      away_team_id:
        example: 00000000-0000-0000-0000-000000000002
        type: string
      home_team_id:
        example: 00000000-0000-0000-0000-000000000001
        type: string
      match_date:
        example: "2026-09-15"
        type: string
      match_time:
        example: "19:30:00"
        type: string
    required:
    - away_team_id
    - home_team_id
    - match_date
    - match_time
    type: object
  handler.CreatePlayerRequest:
    properties:
      height:
        example: 187
        type: number
      jersey_number:
        example: 9
        type: integer
      name:
        example: Marko Simic
        type: string
      playstyle:
        example: Goal Poacher
        type: string
      position:
        example: CF
        type: string
      team_id:
        example: 00000000-0000-0000-0000-000000000001
        type: string
      weight:
        example: 84
        type: number
    required:
    - height
    - jersey_number
    - name
    - position
    - team_id
    - weight
    type: object
  handler.CreateResultRequest:
    properties:
      away_score:
        example: 1
        minimum: 0
        type: integer
      goals:
        items:
          $ref: '#/definitions/handler.GoalInput'
        type: array
      home_score:
        example: 2
        minimum: 0
        type: integer
      match_id:
        example: 00000000-0000-0000-0000-000000000001
        type: string
    required:
    - goals
    - match_id
    type: object
  handler.CreateTeamRequest:
    properties:
      address:
        example: Jl. Rasuna Said Kav. C-22
        type: string
      city:
        example: Jakarta
        type: string
      founded_year:
        example: 1928
        minimum: 1
        type: integer
      logo_url:
        example: https://upload.wikimedia.org/wikipedia/id/5/5e/Logo_Persija.png
        type: string
      name:
        example: Persija Jakarta
        type: string
    required:
    - address
    - city
    - founded_year
    - name
    type: object
  handler.ErrorDetail:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/handler.ErrorDetail'
      success:
        type: boolean
    type: object
  handler.GoalInput:
    properties:
      goal_time:
        example: "24"
        type: string
      player_id:
        example: 00000000-0000-0000-0000-000000000001
        type: string
    required:
    - goal_time
    - player_id
    type: object
  handler.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  handler.PaginatedResponse:
    properties:
      data: {}
      limit:
        type: integer
      page:
        type: integer
      success:
        type: boolean
      total:
        type: integer
    type: object
  handler.RefreshTokenRequest:
    properties:
      refresh_token:
        example: d290f1ee-6c54-4b01-90e6-d701748f0851
        type: string
    required:
    - refresh_token
    type: object
  handler.RegisterRequest:
    properties:
      name:
        example: Admin Staff
        type: string
      password:
        example: password123
        minLength: 6
        type: string
      role:
        enum:
        - admin
        - staff
        - viewer
        example: staff
        type: string
      username:
        example: admin_staff
        type: string
    required:
    - name
    - password
    - role
    - username
    type: object
  handler.RevertRequest:
    properties:
      target_version:
        example: 1
        type: integer
    required:
    - target_version
    type: object
  handler.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  handler.UpdateMatchStatusRequest:
    properties:
      status:
        example: completed
        type: string
      version:
        example: 1
        type: integer
    required:
    - status
    - version
    type: object
  handler.UpdatePlayerRequest:
    properties:
      height:
        example: 187
        type: number
      jersey_number:
        example: 9
        type: integer
      name:
        example: Marko Simic
        type: string
      playstyle:
        example: Goal Poacher
        type: string
      position:
        example: CF
        type: string
      version:
        example: 1
        type: integer
      weight:
        example: 84
        type: number
    required:
    - height
    - jersey_number
    - name
    - position
    - version
    - weight
    type: object
  handler.UpdateTeamRequest:
    properties:
      address:
        example: Jl. Rasuna Said Kav. C-22 Baru
        type: string
      city:
        example: Jakarta
        type: string
      founded_year:
        example: 1928
        type: integer
      logo_url:
        example: https://upload.wikimedia.org/wikipedia/id/5/5e/Logo_Persija.png
        type: string
      name:
        example: Persija Jakarta Updated
        type: string
      version:
        example: 1
        type: integer
    required:
    - version
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for managing amateur football teams, players, matches, and
    reports for Perusahaan XYZ.
  title: Kickbase Football Team Management API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return Access Token + Refresh Token + Permissions
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new token pair
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Refresh access token
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with role (admin, staff, viewer)
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /api/matches:
    get:
      description: Get a paginated list of matches with optional team, status, date
        filtering and sorting
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by team ID (supports OP:VAL e.g. EQ:uuid, IN:uuid1,uuid2)
        in: query
        name: team_id
        type: string
      - description: Filter by match status (supports OP:VAL e.g. EQ:scheduled, IN:scheduled,deferred)
        in: query
        name: status
        type: string
      - description: Filter matches from date (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Filter matches to date (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: Filter match date (supports OP:VAL e.g. EQ:2026-09-01, BT:2026-09-01,2026-09-30)
        in: query
        name: match_date
        type: string
      - default: match_date
        description: Sort field (match_date, created_at)
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort order (asc, desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse'
      summary: List all matches
      tags:
      - Matches
    post:
      consumes:
      - application/json
      description: Schedule a match between two different teams
      parameters:
      - description: Match schedule data
        in: body
        name: match
        required: true
        schema:
          $ref: '#/definitions/handler.CreateMatchRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Schedule a new match
      tags:
      - Matches
  /api/matches/{id}:
    get:
      description: Get a single match by its ID
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get a match by ID
      tags:
      - Matches
  /api/matches/{id}/history:
    get:
      description: Get the version history of a match
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
      summary: Get match history
      tags:
      - Matches
  /api/matches/{id}/revert:
    post:
      consumes:
      - application/json
      description: Revert a match to a specific previous version
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      - description: Target version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RevertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revert match to previous version
      tags:
      - Matches
  /api/matches/{id}/status:
    patch:
      consumes:
      - application/json
      description: Update the status of a match (scheduled, completed, cancelled,
        deferred)
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateMatchStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update match status
      tags:
      - Matches
  /api/players:
    get:
      description: Get a paginated list of players with optional team, position, name
        filtering and sorting
      parameters:
      - description: Filter by team ID (supports OP:VAL e.g. EQ:uuid, IN:uuid1,uuid2)
        in: query
        name: team_id
        type: string
      - description: Filter by position (supports OP:VAL e.g. EQ:CF, IN:CF,SS,LWF,
          NI:GK)
        in: query
        name: position
        type: string
      - description: Filter by player name (supports OP:VAL e.g. CT:Bambang)
        in: query
        name: name
        type: string
      - description: Filter by height in cm (supports OP:VAL e.g. GT:180, BT:170,185)
        in: query
        name: height
        type: string
      - description: Filter by weight in kg (supports OP:VAL e.g. LT:75, GTE:70)
        in: query
        name: weight
        type: string
      - description: Filter by jersey number (supports OP:VAL e.g. EQ:10, LT:20)
        in: query
        name: jersey_number
        type: string
      - default: created_at
        description: Sort field (name, jersey_number, height, weight, created_at)
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort order (asc, desc)
        in: query
        name: order
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse'
      summary: List all players
      tags:
      - Players
    post:
      consumes:
      - application/json
      description: Add a player to a team with tactical position and playstyle validation
      parameters:
      - description: Player data
        in: body
        name: player
        required: true
        schema:
          $ref: '#/definitions/handler.CreatePlayerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a new player
      tags:
      - Players
  /api/players/{id}:
    delete:
      description: Soft delete a player (only if no goal records)
      parameters:
      - description: Player ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a player
      tags:
      - Players
    get:
      description: Get a single player by their ID
      parameters:
      - description: Player ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get a player by ID
      tags:
      - Players
    put:
      consumes:
      - application/json
      description: Update an existing player's information
      parameters:
      - description: Player ID
        in: path
        name: id
        required: true
        type: string
      - description: Player data with version
        in: body
        name: player
        required: true
        schema:
          $ref: '#/definitions/handler.UpdatePlayerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a player
      tags:
      - Players
  /api/players/{id}/history:
    get:
      description: Get the version history of a player
      parameters:
      - description: Player ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
      summary: Get player history
      tags:
      - Players
  /api/players/{id}/revert:
    post:
      consumes:
      - application/json
      description: Revert a player to a specific previous version
      parameters:
      - description: Player ID
        in: path
        name: id
        required: true
        type: string
      - description: Target version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RevertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revert player to previous version
      tags:
      - Players
  /api/reports/matches:
    get:
      description: Get a paginated list of match reports with optional team and result
        status filtering
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by team ID
        in: query
        name: team_id
        type: string
      - description: Filter by match status / outcome (Tim Home Menang, Tim Away Menang,
          Draw, scheduled)
        in: query
        name: status
        type: string
      - default: match_date
        description: Sort field (match_date, created_at)
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Sort order (asc, desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse'
      summary: List all match reports
      tags:
      - Reports
  /api/reports/matches/{id}:
    get:
      description: Get detailed report for a specific match including score, status,
        top scorer, and cumulative wins
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get a single match report
      tags:
      - Reports
  /api/results:
    post:
      consumes:
      - application/json
      description: Record the final score and goals for a completed match
      parameters:
      - description: Match result data with goals
        in: body
        name: result
        required: true
        schema:
          $ref: '#/definitions/handler.CreateResultRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Report match result
      tags:
      - Results
  /api/results/{matchId}:
    get:
      description: Get the result of a specific match
      parameters:
      - description: Match ID
        in: path
        name: matchId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get match result
      tags:
      - Results
  /api/teams:
    get:
      description: Get a paginated list of teams with optional search and sorting
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by team name (supports OP:VAL e.g. CT:Pers, EQ:Persija)
        in: query
        name: name
        type: string
      - description: Filter by city (supports OP:VAL e.g. EQ:Jakarta, IN:Jakarta,Bandung)
        in: query
        name: city
        type: string
      - description: Filter by founded year (supports OP:VAL e.g. GT:1930, BT:1920,1980)
        in: query
        name: founded_year
        type: string
      - default: created_at
        description: Sort field (name, founded_year, city, created_at)
        in: query
        name: sort_by
        type: string
      - default: desc
        description: Sort order (asc, desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse'
      summary: List all teams
      tags:
      - Teams
    post:
      consumes:
      - application/json
      description: Add a new team with unique name
