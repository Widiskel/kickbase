basePath: /
definitions:
  internal_handler.CreateMatchRequest:
    properties:
      away_team_id:
        type: string
      home_team_id:
        type: string
      match_date:
        type: string
      match_time:
        type: string
    required:
    - away_team_id
    - home_team_id
    - match_date
    - match_time
    type: object
  internal_handler.CreatePlayerRequest:
    properties:
      height:
        type: number
      jersey_number:
        type: integer
      name:
        type: string
      playstyle:
        type: string
      position:
        type: string
      team_id:
        type: string
      weight:
        type: number
    required:
    - height
    - jersey_number
    - name
    - position
    - team_id
    - weight
    type: object
  internal_handler.CreateResultRequest:
    properties:
      away_score:
        minimum: 0
        type: integer
      goals:
        items:
          $ref: '#/definitions/internal_handler.GoalInput'
        type: array
      home_score:
        minimum: 0
        type: integer
      match_id:
        type: string
    required:
    - match_id
    type: object
  internal_handler.CreateTeamRequest:
    properties:
      address:
        type: string
      city:
        type: string
      founded_year:
        minimum: 1
        type: integer
      logo_url:
        type: string
      name:
        type: string
    required:
    - address
    - city
    - founded_year
    - name
    type: object
  internal_handler.ErrorDetail:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  internal_handler.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/internal_handler.ErrorDetail'
      success:
        type: boolean
    type: object
  internal_handler.GoalInput:
    properties:
      goal_time:
        type: string
      player_id:
        type: string
    required:
    - goal_time
    - player_id
    type: object
  internal_handler.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  internal_handler.PaginatedResponse:
    properties:
      data: {}
      limit:
        type: integer
      page:
        type: integer
      success:
        type: boolean
      total:
        type: integer
    type: object
  internal_handler.RegisterRequest:
    properties:
      name:
        type: string
      password:
        minLength: 6
        type: string
      role:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - name
    - password
    - username
    type: object
  internal_handler.RevertRequest:
    properties:
      target_version:
        type: integer
    required:
    - target_version
    type: object
  internal_handler.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  internal_handler.UpdateMatchStatusRequest:
    properties:
      status:
        type: string
      version:
        type: integer
    required:
    - status
    - version
    type: object
  internal_handler.UpdatePlayerRequest:
    properties:
      height:
        type: number
      jersey_number:
        type: integer
      name:
        type: string
      playstyle:
        type: string
      position:
        type: string
      version:
        type: integer
      weight:
        type: number
    required:
    - height
    - jersey_number
    - name
    - position
    - version
    - weight
    type: object
  internal_handler.UpdateTeamRequest:
    properties:
      address:
        type: string
      city:
        type: string
      founded_year:
        type: integer
      logo_url:
        type: string
      name:
        type: string
      version:
        type: integer
    required:
    - version
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for managing amateur football teams, players, matches, and
    reports for Perusahaan XYZ.
  title: Kickbase Football Team Management API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT bearer token
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/internal_handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user (admin/staff)
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /api/matches:
    get:
      description: Get a paginated list of all matches
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.PaginatedResponse'
      summary: List all matches
      tags:
      - Matches
    post:
      consumes:
      - application/json
      description: Create a match schedule between two teams
      parameters:
      - description: Match data
        in: body
        name: match
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateMatchRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Schedule a new match
      tags:
      - Matches
  /api/matches/{id}:
    get:
      description: Get a single match by its ID
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Get a match by ID
      tags:
      - Matches
  /api/matches/{id}/history:
    get:
      description: Get the version history of a match
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
      summary: Get match history
      tags:
      - Matches
  /api/matches/{id}/revert:
    post:
      consumes:
      - application/json
      description: Revert a match to a specific previous version
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      - description: Target version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RevertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Revert match to previous version
      tags:
      - Matches
  /api/matches/{id}/status:
    patch:
      consumes:
      - application/json
      description: Update the status of a match (scheduled, completed, cancelled,
        deferred)
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateMatchStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Update match status
      tags:
      - Matches
  /api/players:
    get:
      description: Get a paginated list of players, optionally filtered by team
      parameters:
      - description: Filter by team ID
        in: query
        name: team_id
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.PaginatedResponse'
      summary: List all players
      tags:
      - Players
    post:
      consumes:
      - application/json
      description: Add a new player to a team
      parameters:
      - description: Player data
        in: body
        name: player
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreatePlayerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Create a new player
      tags:
      - Players
  /api/players/{id}:
    delete:
      description: Soft delete a player (only if no goal records)
      parameters:
      - description: Player ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Delete a player
      tags:
      - Players
    get:
      description: Get a single player by its ID
      parameters:
      - description: Player ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Get a player by ID
      tags:
      - Players
    put:
      consumes:
      - application/json
      description: Update an existing player's information
      parameters:
      - description: Player ID
        in: path
        name: id
        required: true
        type: string
      - description: Player data with version
        in: body
        name: player
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdatePlayerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Update a player
      tags:
      - Players
  /api/players/{id}/history:
    get:
      description: Get the version history of a player
      parameters:
      - description: Player ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
      summary: Get player history
      tags:
      - Players
  /api/players/{id}/revert:
    post:
      consumes:
      - application/json
      description: Revert a player to a specific previous version
      parameters:
      - description: Player ID
        in: path
        name: id
        required: true
        type: string
      - description: Target version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RevertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Revert player to previous version
      tags:
      - Players
  /api/reports/matches:
    get:
      description: Get a paginated list of all match reports with scores and status
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.PaginatedResponse'
      summary: List all match reports
      tags:
      - Reports
  /api/reports/matches/{id}:
    get:
      description: Get detailed report for a specific match including score, status,
        top scorer, and cumulative wins
      parameters:
      - description: Match ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Get a single match report
      tags:
      - Reports
  /api/results:
    post:
      consumes:
      - application/json
      description: Report the result of a completed match with goals
      parameters:
      - description: Match result with goals
        in: body
        name: result
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateResultRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Report match result
      tags:
      - Results
  /api/results/{matchId}:
    get:
      description: Get the result of a specific match
      parameters:
      - description: Match ID
        in: query
        name: matchId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Get match result
      tags:
      - Results
  /api/teams:
    get:
      description: Get a paginated list of all non-deleted teams
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.PaginatedResponse'
      summary: List all teams
      tags:
      - Teams
    post:
      consumes:
      - application/json
      description: Create a new football team with the provided details
      parameters:
      - description: Team data
        in: body
        name: team
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateTeamRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Create a new team
      tags:
      - Teams
  /api/teams/{id}:
    delete:
      description: Soft delete a team (only if no active players)
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Delete a team
      tags:
      - Teams
    get:
      description: Get a single team by its ID
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Get a team by ID
      tags:
      - Teams
    put:
      consumes:
      - application/json
      description: Update an existing team's information
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: Team data with version
        in: body
        name: team
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateTeamRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Update a team
      tags:
      - Teams
  /api/teams/{id}/history:
    get:
      description: Get the version history of a team
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
      summary: Get team history
      tags:
      - Teams
  /api/teams/{id}/revert:
    post:
      consumes:
      - application/json
      description: Revert a team to a specific previous version
      parameters:
      - description: Team ID
        in: path
        name: id
        required: true
        type: string
      - description: Target version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RevertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Revert team to previous version
      tags:
      - Teams
produces:
- application/json
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
